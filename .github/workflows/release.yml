name: Release

# Pushing a tag like v0.1.0 builds an unsigned DMG and attaches it to a DRAFT
# GitHub Release. Publishing the draft is a manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build DMG (macOS arm64)
    runs-on: macos-latest # Apple Silicon (aarch64)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches app version
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${app_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v${app_version}" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.1.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm run typecheck
          pnpm test

      - name: Build app and DMG (ad-hoc signed)
        run: pnpm tauri build --bundles dmg

      - name: Verify the app signature inside the DMG
        run: scripts/verify-dmg-signature.sh src-tauri/target/release/bundle/dmg

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only this job can create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist-dmg

      - name: Create draft release with the DMG attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist-dmg/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "MD Viewer $TAG" \
            --generate-notes \
            --notes "Unsigned build for Apple Silicon Macs. See the README for the Gatekeeper steps on first launch."
