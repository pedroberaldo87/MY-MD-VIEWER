name: Tests

# CI only runs tests. Builds and releases are always done locally by the
# maintainer (scripts/release-local.sh), never by GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests (macOS arm64)
    runs-on: macos-latest # Apple Silicon (aarch64)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.1.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Create the front-end placeholder for the Tauri macro
        # tauri::generate_context! needs frontendDist (../dist) to exist when
        # compiling. The tests do not use the real front-end build.
        run: mkdir -p dist && touch dist/index.html

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
